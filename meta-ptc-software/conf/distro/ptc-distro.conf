# meta-ptc/conf/distro/ptc-distro.conf

DISTRO = "ptc-distro"
DISTRO_NAME = "PTC Minimal Embedded Linux"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "lean"

INIT_MANAGER = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_initscripts = ""

PACKAGE_CLASSES ?= "package_ipk"

USE_NLS = "no"
IMAGE_LINGUAS = ""

DISTRO_FEATURES = " \
    systemd \
    ipv4 \
    ipv6 \
    usrmerge \
"

DISTRO_FEATURES:remove = " \
    alsa \
    bluetooth \
    nfc \
    3g \
    nfs \
    zeroconf \
    x11 \
    wayland \
    opengl \
    vulkan \
    pulseaudio \
"

VOLATILE_LOG_DIR = "yes"